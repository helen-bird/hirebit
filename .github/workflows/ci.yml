name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - run: npm run hypit:setup
      - run: pnpm --dir vendor/hypit install --frozen-lockfile
      - run: npm run repo:check
      - run: npm run check
      - run: npm test
